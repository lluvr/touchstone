name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install library (with dev extras) and touchstone-mcp (with test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e "./touchstone-mcp[test]"

      - name: Run library test suite
        run: pytest --cov=clarethium_touchstone --cov-report=term-missing --cov-fail-under=95

      - name: Run touchstone-mcp test suite
        run: pytest -q touchstone-mcp/tests

      - name: Upload coverage to summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            python -c "import coverage; c = coverage.Coverage(); c.load(); c.report()" >> $GITHUB_STEP_SUMMARY 2>&1 || true
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install library (with dev extras) and touchstone-mcp (with test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e "./touchstone-mcp[test]"

      - name: Run ruff check (library)
        run: ruff check src tests examples benchmarks

      - name: Run ruff format check (library)
        run: ruff format --check src tests examples benchmarks

      - name: Run ruff check (touchstone-mcp)
        run: ruff check touchstone-mcp

      - name: Run ruff format check (touchstone-mcp)
        run: ruff format --check touchstone-mcp

  typecheck:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install library (with dev extras) and touchstone-mcp (with test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e "./touchstone-mcp[test]"

      - name: Run mypy (library)
        run: mypy src

      - name: Run mypy (touchstone-mcp)
        run: mypy touchstone-mcp/touchstone_mcp.py

  build:
    name: Build both distributions
    runs-on: ubuntu-latest
    needs: [test, lint, typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build library (clarethium-touchstone) sdist + wheel
        run: python -m build

      - name: Build touchstone-mcp sdist + wheel
        run: python -m build touchstone-mcp

      - name: Upload library artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-clarethium-touchstone
          path: dist/
          retention-days: 30

      - name: Upload touchstone-mcp artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-touchstone-mcp
          path: touchstone-mcp/dist/
          retention-days: 30
