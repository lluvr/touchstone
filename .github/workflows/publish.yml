name: publish

# Tag-driven release for the touchstone-mcp package.
#
# Supply-chain posture (matches the pattern used across the Clarethium
# org): the wheel + sdist are built, a GitHub build-provenance
# attestation is generated, and publishing happens via PyPI Trusted
# Publishing (OIDC) from a protected `pypi` environment. No long-lived
# PyPI token is used.
#
# One-time setup required before the first tagged release:
#   1. Create a `pypi` environment in the repo settings.
#   2. Register this repo + workflow as a Trusted Publisher on the
#      touchstone-mcp PyPI project (Publishing -> Add a new publisher:
#      workflow `publish.yml`, environment `pypi`).
# Until both exist the publish job will fail closed, which is the
# intended safe default.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC for the build-provenance attestation
      attestations: write   # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify tag matches pyproject version
        # Tag drives the release; the wheel name (touchstone_mcp-X.Y.Z)
        # must match the tag (vX.Y.Z). Runs only on tag pushes;
        # workflow_dispatch from a branch has no tag context.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF"].removeprefix("refs/tags/v")
          with open("pyproject.toml", "rb") as f:
              pyver = tomllib.load(f)["project"]["version"]
          if tag != pyver:
              print(f"::error::Tag maps to {tag!r}; pyproject version is {pyver!r}.")
              sys.exit(1)
          PY

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/touchstone-mcp/
    permissions:
      id-token: write       # OIDC Trusted Publishing (PEP 740 attestations)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
