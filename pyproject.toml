[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clarethium-touchstone"
version = "0.1.1"
description = "Hallucination detection for LLM outputs — without calling another LLM. Reference implementation of Touchstone Standard 1.0."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Lovro Lucic", email = "11740211+lluvr@users.noreply.github.com" },
]
keywords = [
    "ai",
    "ai-evaluation",
    "ai-output",
    "fabrication-detection",
    "grounding",
    "hallucination-detection",
    "mcp",
    "model-context-protocol",
    "structural-verification",
    "touchstone",
    "clarethium",
    "model-independent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

# Core implementation is dependency-free. All eleven measurement layers
# operate on regex, structural analysis, source matching, and arithmetic.
# Layer 1a (heading defaultness) accepts a vendor-neutral
# ``BaselineGenerator`` callable so the user supplies their own LLM
# client (Gemini, Claude, OpenAI, etc.) - the library imports no
# specific provider SDK.
dependencies = []

[project.optional-dependencies]
# Development tooling
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
# MCP server. Installs the FastMCP runtime and registers the
# ``touchstone-mcp`` console script that any MCP host (Claude
# Desktop, Claude Code, Cursor, custom) can attach as a stdio MCP
# server. See ``docs/mcp.md`` for host wiring instructions.
mcp = [
    "fastmcp>=2.0",
]
# External-corpus benchmark dependencies. NOT part of the base library
# install. The ``benchmarks/external/*`` runners load third-party corpora
# from the HuggingFace Hub and compare Touchstone against MiniCheck
# (Tang et al., EMNLP 2024) as an LLM-based baseline. Install only when
# reproducing or extending the external validation runs.
#
# MiniCheck itself is not published to PyPI and must be installed
# separately when needed:
#
#     pip install "minicheck @ git+https://github.com/Liyan06/MiniCheck.git@main"
#
# It is intentionally left out of this ``external`` extra so the
# parent ``clarethium-touchstone`` wheel remains PyPI-compatible
# (PyPI forbids direct git URLs in published metadata).
external = [
    "datasets>=2.14",
    "accelerate>=0.30",
]

[project.scripts]
# Console script for the MCP server. Available only when the ``mcp``
# extra is installed (pip install ``clarethium-touchstone[mcp]``);
# invocation will fail with an ImportError pointing the user to the
# extra otherwise.
touchstone-mcp = "clarethium_touchstone.mcp.server:main"

[project.urls]
Homepage = "https://touchstone.clarethium.com"
Documentation = "https://touchstone.clarethium.com"
Repository = "https://github.com/Clarethium/touchstone"
Standard = "https://github.com/Clarethium/touchstone/blob/main/STANDARDS/touchstone-1.0.md"
Changelog = "https://github.com/Clarethium/touchstone/blob/main/CHANGELOG.md"
Issues = "https://github.com/Clarethium/touchstone/issues"

[tool.setuptools]
packages = ["clarethium_touchstone", "clarethium_touchstone.mcp"]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
clarethium_touchstone = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
