[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "touchstone-mcp"
version = "0.1.10"
description = "A cheap, deterministic first-pass filter for unsupported claims in LLM output, computed without a second model call. Not a standalone hallucination detector. MCP server plus the reference implementation of Touchstone Standard 1.0."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Lovro Lucic", email = "11740211+lluvr@users.noreply.github.com" },
]
keywords = [
    "ai",
    "ai-evaluation",
    "ai-output",
    "fabrication-detection",
    "grounding",
    "hallucination-detection",
    "mcp",
    "model-context-protocol",
    "structural-verification",
    "touchstone",
    "clarethium",
    "model-independent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

# The measurement library (clarethium_touchstone) is dependency-free:
# all eleven layers are regex, structural analysis, source matching, and
# arithmetic, and Layer 1a takes a vendor-neutral ``BaselineGenerator``
# callable so the caller supplies their own LLM client. The MCP server
# (touchstone_mcp) adds fastmcp to expose the library over the Model
# Context Protocol.
dependencies = ["fastmcp>=3.3.1"]

[project.optional-dependencies]
# Development tooling
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=2.1.0",
]
# External-corpus benchmark dependencies. NOT part of the base library
# install. The ``benchmarks/external/*`` runners load third-party corpora
# from the HuggingFace Hub and compare Touchstone against MiniCheck
# (Tang et al., EMNLP 2024) as an LLM-based baseline. Install only when
# reproducing or extending the external validation runs.
#
# MiniCheck itself is not published to PyPI and must be installed
# separately when needed:
#
#     pip install "minicheck @ git+https://github.com/Liyan06/MiniCheck.git@main"
#
# It is intentionally left out of this ``external`` extra so the
# parent ``touchstone-mcp`` wheel remains PyPI-compatible
# (PyPI forbids direct git URLs in published metadata).
external = [
    "datasets>=4.8.5",
    "accelerate>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/lluvr/touchstone"
Documentation = "https://github.com/lluvr/touchstone/tree/main/docs"
Repository = "https://github.com/lluvr/touchstone"
Standard = "https://github.com/lluvr/touchstone/blob/main/STANDARDS/touchstone-1.0.md"
Changelog = "https://github.com/lluvr/touchstone/blob/main/CHANGELOG.md"
Issues = "https://github.com/lluvr/touchstone/issues"

[project.scripts]
touchstone-mcp = "touchstone_mcp:main"

[tool.setuptools]
packages = ["clarethium_touchstone"]
py-modules = ["touchstone_mcp"]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
clarethium_touchstone = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
