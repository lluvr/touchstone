[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clarethium-touchstone"
version = "0.1.0-dev"
description = "Model-independent verification for AI-coupled work. Reference implementation of Touchstone Standard 1.0."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Clarethium" }
]
keywords = [
    "ai",
    "ai-evaluation",
    "ai-output",
    "fabrication-detection",
    "grounding",
    "structural-verification",
    "touchstone",
    "clarethium",
    "model-independent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

# Core implementation has zero dependencies for Layers 1b, 1c, 2, 3, 4, 5, 6, 7, 9, 10
# Layer 1a (heading defaultness) requires google-genai for Gemini API
# Spec compliance Layer 5 (semantic) requires google-genai for embeddings
dependencies = []

[project.optional-dependencies]
# Layer 1a heading defaultness baseline generation; Layer 5 semantic alignment embeddings
gemini = ["google-genai>=1.0"]

# Development tooling
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

# All optional features
all = ["clarethium-touchstone[gemini]"]

[project.urls]
Homepage = "https://touchstone.clarethium.com"
Documentation = "https://touchstone.clarethium.com"
Repository = "https://github.com/Clarethium/touchstone"
Standard = "https://github.com/Clarethium/touchstone/blob/main/STANDARDS/touchstone-1.0.md"
Changelog = "https://github.com/Clarethium/touchstone/blob/main/CHANGELOG.md"
Issues = "https://github.com/Clarethium/touchstone/issues"

[tool.setuptools]
packages = ["clarethium_touchstone"]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
clarethium_touchstone = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
